name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm ci already builds through the prepare script; typecheck is the wider
      # gate, because it is the only pass that also sees the test sources.
      - run: npm run typecheck
      - run: npm test
